<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Scoreboard — Laerskool Fairland</title>
<style>
:root{
  --bg:#090a0f;--s1:#111318;--s2:#191c25;--s3:#242836;--s4:#2e3347;
  --accent:#eab308;--accent-glow:rgba(234,179,8,.15);
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--purple:#a78bfa;
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--muted:#475569;
  --glass:rgba(255,255,255,.03);--glass-b:rgba(255,255,255,.07);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#splash.fade-out{animation:splashOut .6s ease forwards}
@keyframes splashOut{to{opacity:0}}
.spl-logo{margin-bottom:18px;animation:splashIn .5s ease both}
.spl-school{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-bottom:3px;animation:splashIn .5s .1s ease both}
.spl-name{font-size:30px;font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:splashIn .5s .15s ease both}
.spl-hs{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:22px;animation:splashIn .5s .2s ease both}
.spl-rule{width:36px;height:2px;background:linear-gradient(90deg,var(--accent),#15803d);border-radius:2px;margin-bottom:14px;animation:splashIn .5s .25s ease both}
.spl-app{font-size:12px;color:var(--t3);letter-spacing:.08em;animation:splashIn .5s .3s ease both}
@keyframes splashIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* layout */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0a1a0e,rgba(10,26,14,.95));
  border-bottom:1px solid var(--glass-b);backdrop-filter:blur(12px);
  padding:12px 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hdr-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-school{display:flex;flex-direction:column}
.hdr-school-name{font-size:13px;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-school-sub{font-size:10px;color:var(--t1);letter-spacing:.06em}
.live-wrap{display:flex;align-items:center;gap:6px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);position:relative}
.live-dot::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--red);opacity:.4;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.live-txt{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.06em}
.refresh-txt{font-size:11px;color:var(--t1)}
main{max-width:640px;margin:0 auto;padding:20px 14px 40px}

/* cards */
.card{background:linear-gradient(145deg,rgba(255,255,255,.04),var(--glass));border:1px solid var(--glass-b);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.card-label{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t1);margin-bottom:10px}

/* score hero */
.score-big{font-size:44px;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-sub{font-size:13px;color:var(--t3);margin-top:6px}
.rr-num{font-size:26px;font-weight:900;color:var(--t2)}
.rr-lbl{font-size:16px;color:var(--t1);margin-top:2px}
.target-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--glass-b)}
.tg-item{text-align:center}
.tg-val{font-size:20px;font-weight:800}
.tg-lbl{font-size:11px;color:var(--t3);margin-top:2px}

/* batter rows */
.batter-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass-b)}
.batter-row:last-child{border-bottom:none}
.b-dot{width:7px;height:7px;border-radius:50%;background:var(--s4);flex-shrink:0}
.b-dot.striker{background:var(--accent)}
.b-name{font-weight:700;font-size:14px;margin-left:8px}
.b-name.striker{color:var(--accent)}
.b-sub{font-size:11px;color:var(--muted);margin-top:1px;margin-left:8px}
.b-runs{font-size:22px;font-weight:900;text-align:right}
.b-runs.striker{color:var(--accent)}
.b-balls{font-size:11px;color:var(--muted);text-align:right;margin-top:1px}
.bowler-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--glass-b);margin-top:4px}

/* chips / extras */
.extras-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex-chip{font-size:12px;color:var(--t2);background:var(--s2);border-radius:5px;padding:3px 8px;border:1px solid var(--glass-b)}
.ex-total{font-size:16px;font-weight:800;color:var(--t1)}

/* fow chips */
.fow-chip{display:inline-block;background:var(--s2);color:var(--t2);border-radius:5px;padding:2px 7px;font-size:11px;margin:2px;border:1px solid var(--glass-b)}

/* result banner */
.result-banner{background:linear-gradient(145deg,rgba(56,189,248,.1),rgba(56,189,248,.04));border:1px solid rgba(234,179,8,.25);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}

/* inn tabs */
.inn-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.itab{padding:6px 14px;border-radius:20px;border:1px solid var(--s4);background:transparent;color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.itab.on{background:linear-gradient(135deg,#14532d,#14532d);color:#86efac;border-color:rgba(22,163,74,.4)}

/* table */
.sc-table{width:100%;border-collapse:collapse;font-size:12px}
.sc-table th{background:rgba(255,255,255,.04);color:var(--t3);padding:7px 5px;text-align:left;font-weight:600}
.sc-table td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.04)}
.sc-table .tr{text-align:right}
.sc-table .bold{font-weight:700;color:var(--accent)}

/* meta chips */
.meta-chip{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--glass-b);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--t2)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* free hit */
.freehit{display:inline-block;background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(251,191,36,.08));color:#fbbf24;border:1px solid rgba(251,191,36,.35);border-radius:8px;padding:4px 14px;font-size:13px;font-weight:700;margin-bottom:10px;box-shadow:0 0 16px rgba(251,191,36,.12)}

/* empty / loading */
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:40px;margin-bottom:14px}
.empty h2{font-size:16px;font-weight:700;color:var(--t2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}
.updated{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}

/* score to beat */
.target-line{font-size:17px;color:var(--t1);margin-top:8px}

/* current over */
.over-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-b)}
.over-lbl{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t1);margin-bottom:8px}
.over-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.over-chip{min-width:32px;height:32px;padding:0 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;background:var(--s3);color:var(--t1)}
.over-chip.dot{background:var(--s2);color:var(--t1)}
.over-chip.four{background:rgba(52,211,153,.2);color:var(--green)}
.over-chip.six{background:rgba(167,139,250,.25);color:var(--purple);border-radius:8px}
.over-chip.wkt{background:rgba(248,113,113,.25);color:var(--red);border-radius:8px}
.over-chip.extra{background:rgba(251,191,36,.2);color:var(--amber);border-radius:8px}
.target-line b{color:var(--accent);font-weight:800}

/* event overlay (four / six / wicket) — sized and positioned in JS to exactly
   cover the score card, so it reads as a replacement for the score, not a
   popup floating over the page */
#eventOverlay{position:fixed;z-index:500;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r);overflow:hidden;pointer-events:none;opacity:0;transition:opacity .25s ease}
#eventOverlay.show{opacity:1}
#eventOverlay .event-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  width:100%;height:100%;background:var(--bg);
  transform:scale(.9);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
#eventOverlay.show .event-inner{transform:scale(1)}
.event-media{width:100%;height:100%;object-fit:cover}
.event-text{font-size:clamp(32px,8vw,56px);font-weight:900;letter-spacing:.03em;
  text-shadow:0 4px 24px rgba(0,0,0,.6)}
.event-text.four{color:var(--green)}
.event-text.six{color:var(--purple)}
.event-text.wicket{color:var(--red)}
.event-text.runout{color:var(--red)}
.event-text.freehit{color:var(--amber);font-size:44px}
.event-text.superbat{color:var(--accent)}
.event-text.superbowl{color:var(--accent)}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img class="spl-logo" src="logo.png" width="110" alt="Laerskool Fairland">
  <div class="spl-school">Laerskool</div>
  <div class="spl-name">Fairland</div>
  <div class="spl-hs">Primary School</div>
  <div class="spl-rule"></div>
  <div class="spl-app">Live Scoreboard</div>
</div>

<main id="root">
  <div class="empty">
    <div class="empty-icon">🏏</div>
    <p>Loading match data…</p>
  </div>
</main>

<div id="eventOverlay">
  <div class="event-inner">
    <img id="eventImg" class="event-media" style="display:none">
    <div id="eventText" class="event-text" style="display:none"></div>
  </div>
</div>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
// splash
(function(){
  const s=document.getElementById('splash');
  setTimeout(()=>{s.classList.add('fade-out');setTimeout(()=>s.remove(),650);},2400);
})();

const params=new URLSearchParams(window.location.search);
const matchId=params.get('match');

function getSetting(k){return JSON.parse(localStorage.getItem('cs_settings')||'{}')[k]||'';}
function ovStr(lb){return Math.floor(lb/6)+'.'+lb%6;}
function getP(teams,id){for(const t of(teams||[])){const p=(t.players||[]).find(p=>p.id===id);if(p)return p;}return null;}
function pName(teams,id){return getP(teams,id)?.name||id;}

// ─── event overlay ──────────────────────────────────────────────────────────────
// Drop your own media next to this file, named to match below (png/jpg/mp4 also
// work — just change the extension). If a file is missing, colored text falls
// back automatically. Files live in the events/ folder next to this file.
const EVENT_MEDIA = {
  four: 'events/four.gif', six: 'events/six.gif', wicket: 'events/wicket.gif',
  runout: 'events/runout.gif', freehit: 'events/freehit.gif',
  superbat: 'events/superbat.gif', superbowl: 'events/superbowl.gif'
};
const EVENT_TEXT = {
  four: 'FOUR!', six: 'SIX!', wicket: 'OUT!',
  runout: 'RUN OUT!', freehit: 'FREE HIT!',
  superbat: 'SUPER OVER!', superbowl: 'SUPER OVER!'
};
let lastEventTs = null, firstRender = true;

function showEvent(type){
  const overlay=document.getElementById('eventOverlay'), img=document.getElementById('eventImg'), text=document.getElementById('eventText');
  // Cover exactly the score card, not the whole screen, so the animation reads
  // as replacing the score rather than floating over the page.
  const card=document.querySelector('#root .card');
  if(card){
    const r=card.getBoundingClientRect();
    Object.assign(overlay.style,{top:r.top+'px',left:r.left+'px',width:r.width+'px',height:r.height+'px'});
  }
  const src=EVENT_MEDIA[type];
  img.style.display='none'; text.style.display='none';
  text.textContent=EVENT_TEXT[type]||''; text.className='event-text '+type;
  img.onload=()=>{img.style.display='block'};
  img.onerror=()=>{img.style.display='none'; text.style.display='block'};
  if(src){ img.src=src+'?t='+Date.now(); } else { text.style.display='block'; }
  overlay.classList.remove('show'); void overlay.offsetWidth; overlay.classList.add('show');
  clearTimeout(window._eventTimer);
  window._eventTimer=setTimeout(()=>overlay.classList.remove('show'), 4500);
}

function renderMatch(data){
  if(!data){
    document.getElementById('root').innerHTML=`<div class="empty"><div class="empty-icon">🏏</div><h2>Match not found</h2><p>The match may not have started yet.<br>Ask the scorer to share an updated link.</p></div>`;
    return;
  }
  const m=data, teams=m.teams||[], innings=m.innings||[];
  const curInn=innings[innings.length-1];

  if(!curInn){
    const t1=teams[0]?.name||'Team 1', t2=teams[1]?.name||'Team 2';
    document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;padding:40px">
      <div class="card-label">${t1} vs ${t2}</div>
      <div style="margin-top:10px;color:var(--t1)">Waiting for the innings to begin&hellip;</div>
    </div>`;
    return;
  }

  const bt=teams[curInn.bi]||{};
  const active=curInn.activeBatters||[];
  const rr=curInn.lb>0?((curInn.total/curInn.lb)*6).toFixed(2):'0.00';
  const battersRow=active.map((id,idx)=>{
    const b=(curInn.batters||{})[id]||{runs:0,balls:0}, isS=idx===0;
    return `<span style="color:${isS?'var(--accent)':'var(--t1)'};font-weight:700">${pName(teams,id)}${isS?' *':''} <span style="color:var(--t1);font-weight:600">${b.runs||0} (${b.balls||0})</span></span>`;
  }).join('<span style="color:var(--t1);margin:0 8px">·</span>');

  // Score to beat, once the second innings is underway
  let targetLine='';
  if(innings.length>=2){
    const prev=innings.find(i=>i.bi!==curInn.bi);
    if(prev){
      const target=prev.total+1, need=Math.max(0,target-curInn.total);
      targetLine=`<div class="target-line">Target <b>${target}</b> · need <b>${need}</b> to win</div>`;
    }
  }

  // Current over, ball by ball
  const curOverIdx=Math.floor(curInn.lb/6);
  const overBalls=(curInn.balls||[]).filter(b=>b.ov===curOverIdx);
  const overLabel='Over '+ovStr(curInn.lb)
    +(m.oversPerInnings>0?' · '+Math.max(0,(m.oversPerInnings*6)-curInn.lb)+' balls left':'');
  let overChipsHtml='';
  if(overBalls.length){
    overChipsHtml=overBalls.map(b=>{
      if(b.dis)return `<div class="over-chip wkt">W</div>`;
      if(b.W)return `<div class="over-chip extra">wd</div>`;
      if(b.NB)return `<div class="over-chip extra">nb${b.runs?'+'+b.runs:''}</div>`;
      if(b.extras?.b)return `<div class="over-chip extra">${b.extras.b}b</div>`;
      if(b.extras?.lb)return `<div class="over-chip extra">${b.extras.lb}lb</div>`;
      if(b.runs===4)return `<div class="over-chip four">4</div>`;
      if(b.runs===6)return `<div class="over-chip six">6</div>`;
      if(b.runs>0)return `<div class="over-chip">${b.runs}</div>`;
      return `<div class="over-chip dot">•</div>`;
    }).join('');
  }
  const overRow=`<div class="over-row"><div class="over-lbl">${overLabel}</div>${overChipsHtml?`<div class="over-chips">${overChipsHtml}</div>`:''}</div>`;

  document.getElementById('root').innerHTML=`<div class="card" style="text-align:center;padding:32px 16px">
    <div class="card-label">${bt.name||'Batting Team'}</div>
    <div class="score-big" style="margin:10px 0">${curInn.total}/${curInn.wickets}</div>
    <div class="rr-lbl">run rate <b style="color:var(--t1)">${rr}</b></div>
    ${battersRow?`<div style="font-size:21px;margin-top:10px">${battersRow}</div>`:''}
    ${targetLine}
    ${overRow}
  </div>`;

  window._sbMatch=m;

  // Fire the four/six/wicket animation when a new event arrives (skip on the very first render)
  if(m.lastEvent && m.lastEvent.ts!==lastEventTs){
    lastEventTs=m.lastEvent.ts;
    if(!firstRender) showEvent(m.lastEvent.type);
  }
  firstRender=false;
}

function switchInn(idx){
  const m=window._sbMatch; if(!m)return;
  document.querySelectorAll('.itab').forEach((el,i)=>el.classList.toggle('on',i===idx));
  const inn=m.innings[idx], pane=document.getElementById('innDetail');
  if(!inn||!pane)return;
  const bt=m.teams[inn.bi]||{}, bwt=m.teams[inn.wi]||{};
  const active=inn.activeBatters||[];
  const seen=new Set(), order=[];
  (inn.balls||[]).forEach(b=>{if(!seen.has(b.bat)){seen.add(b.bat);order.push(b.bat);}});
  (bt.players||[]).forEach(p=>{if(!seen.has(p.id))order.push(p.id);});

  let html=`<div class="card" style="overflow-x:auto"><div class="card-label">${bt.name} batting · ${inn.total}/${inn.wickets} (${ovStr(inn.lb)})</div>
    <table class="sc-table"><thead><tr>
      <th>Batter</th><th>Dismissal</th><th class="tr">R</th><th class="tr">B</th><th class="tr">4s</th><th class="tr">6s</th><th class="tr">SR</th>
    </tr></thead><tbody>`;

  order.forEach(id=>{
    const b=inn.batters?.[id], isA=active.includes(id);
    if(!b&&!isA)return;
    const br=b||{runs:0,balls:0,fours:0,sixes:0,howOut:null};
    const sr=br.balls>0?((br.runs/br.balls)*100).toFixed(0):'-';
    let out='did not bat';
    if(isA)out='not out';
    else if(br.howOut){
      const bp=br.bowler?pName(m.teams,br.bowler):null, fp=br.fielder?pName(m.teams,br.fielder):null;
      if(br.howOut==='Bowled')out='b '+(bp||'');
      else if(br.howOut==='Caught')out='c '+(fp||'')+' b '+(bp||'');
      else if(br.howOut==='LBW')out='lbw b '+(bp||'');
      else if(br.howOut==='Run Out')out='run out ('+(fp||'')+')';
      else if(br.howOut==='Stumped')out='st '+(fp||'')+' b '+(bp||'');
      else out=br.howOut;
    }
    const dnb=out==='did not bat';
    html+=`<tr${dnb?' style="opacity:.4"':''}>
      <td style="font-weight:700;color:${isA?'var(--accent)':'var(--t1)'}">${pName(m.teams,id)}${isA&&active[0]===id?' *':''}</td>
      <td style="font-size:11px;color:var(--muted)">${out}</td>
      <td class="tr bold">${dnb?'':br.runs}</td><td class="tr">${dnb?'':br.balls}</td>
      <td class="tr">${dnb?'':br.fours||0}</td><td class="tr">${dnb?'':br.sixes||0}</td><td class="tr">${dnb?'':sr}</td>
    </tr>`;
  });
  const ex=inn.extras||{}, exT=(ex.b||0)+(ex.lb||0)+(ex.wd||0)+(ex.nb||0)+(ex.pen||0);
  html+=`<tr><td colspan="2" style="font-size:11px;color:var(--t3)">Extras (b ${ex.b||0} lb ${ex.lb||0} wd ${ex.wd||0} nb ${ex.nb||0})</td><td class="tr bold">${exT}</td><td colspan="4"></td></tr>
  <tr style="background:rgba(255,255,255,.03)"><td colspan="2" style="font-weight:800">Total</td><td class="tr bold" style="font-size:14px">${inn.total}/${inn.wickets}</td><td colspan="4" style="text-align:right;font-size:11px;color:var(--t3)">${ovStr(inn.lb)} ov</td></tr>
  </tbody></table></div>`;

  if((inn.fow||[]).length){
    html+=`<div class="card"><div class="card-label">Fall of wickets</div><div>`;
    inn.fow.forEach(f=>{html+=`<span class="fow-chip">${f.w}-${f.runs} (${pName(m.teams,f.bat)}, ${f.ov})</span>`;});
    html+=`</div></div>`;
  }

  html+=`<div class="card" style="overflow-x:auto"><div class="card-label">${bwt.name} bowling</div>
    <table class="sc-table"><thead><tr>
      <th>Bowler</th><th class="tr">O</th><th class="tr">M</th><th class="tr">R</th><th class="tr">W</th><th class="tr">Wd</th><th class="tr">NB</th><th class="tr">Eco</th>
    </tr></thead><tbody>`;

  [...new Set((inn.balls||[]).map(b=>b.bwl))].forEach(id=>{
    const bwl=inn.bowlers?.[id]||{};
    const ov=Math.floor((bwl.lb||0)/6)+'.'+(bwl.lb||0)%6;
    const eco=bwl.lb>0?((bwl.runs/bwl.lb)*6).toFixed(1):'-';
    html+=`<tr><td style="font-weight:700">${pName(m.teams,id)}</td>
      <td class="tr">${ov}</td><td class="tr">${bwl.maidens||0}</td>
      <td class="tr">${bwl.runs||0}</td><td class="tr bold">${bwl.wickets||0}</td>
      <td class="tr">${bwl.wides||0}</td><td class="tr">${bwl.noballs||0}</td><td class="tr">${eco}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  pane.innerHTML=html;
}

// Public viewers (other devices) use this key to subscribe read-only — no per-device setup needed.
// Use an Ably key scoped to "subscribe" capability only (not the full/root key) so a leaked
// public key can't be used to publish or manage your account. Paste it between the quotes below.
const PUBLIC_ABLY_KEY = "RrGsHw.hvYJ6A:jwCtaT5fUuHyQA-a4aDL4hnH2N-MBbLILidZBDlqLgw";

function loadMatch(){
  const key=getSetting('ablyKey')||PUBLIC_ABLY_KEY;
  if(key&&matchId){
    try{
      const ably=new Ably.Realtime({key,closeOnUnload:true});
      // [?rewind=1] replays the last published message so latecomers see current score immediately
      const ch=ably.channels.get('[?rewind=1]fairland-cricket-'+matchId);
      ch.subscribe('score',msg=>renderMatch(msg.data));
      return;
    }catch(e){console.warn('Ably:',e.message);}
  }
  // Fallback: localStorage (same device as scorer)
  if(matchId){
    const h=JSON.parse(localStorage.getItem('cs_h')||'[]');
    const m=h.find(x=>(x.shareId||x.id)===matchId||x.id===matchId);
    if(m){renderMatch(m);return;}
  }
  document.getElementById('root').innerHTML=`<div class="empty"><div class="empty-icon">🏏</div><h2>No match data</h2><p>Add your Ably API key in the scorer app settings, or open this link on the same device as the scorer.</p></div>`;
}

loadMatch();
</script>
